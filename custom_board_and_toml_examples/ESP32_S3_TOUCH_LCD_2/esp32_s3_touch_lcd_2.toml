[MCU.esp32]
# ESP32-S3 Touch LCD 2" — per Waveshare, S3 with PSRAM/Flash
BOARD = "ESP32_GENERIC_S3"
BOARD_VARIANT = "SPIRAM_OCT"
flash_size = 16
enable_jtag_repl = 'n'
enable_cdc_repl = 'n'
enable_uart_repl = 'y'
uart_repl_bitrate = 115200

# Display: ST7789 240x320 over SPI (4-wire). Touch: CST816-series over I2C.
# NOTE: Pin numbers below match the Waveshare schematic/demo.

[SPI.Bus.spi_bus]
host = 1                    # SPI host (1==SPI2 on ESP32-S3)
# Pinout from Arduino example (EXAMPLE_PIN_NUM_* macros)
sck = 39                    # EXAMPLE_PIN_NUM_LCD_SCLK
mosi = 38                   # EXAMPLE_PIN_NUM_LCD_MOSI
miso = 40                   # EXAMPLE_PIN_NUM_LCD_MISO (ST7789 ignores reads; keep for bus completeness)

[SPIBus.display_bus]
spi_bus = "spi_bus"
freq = 40000000             # 40MHz is typical for ST7789
dc = 42                     # EXAMPLE_PIN_NUM_LCD_DC
cs = 45                     # EXAMPLE_PIN_NUM_LCD_CS

[I2C.Bus.i2c_bus]
host = 0
# Touch panel (CST816* family) I2C pins from Arduino example
scl = 47                    # EXAMPLE_PIN_NUM_TP_SCL
sda = 48                    # EXAMPLE_PIN_NUM_TP_SDA
freq = 400000

[I2C.Device.indev_device]
bus = "i2c_bus"
# CST816S default address 0x15 (decimal 21). Adjust if schematic specifies otherwise.
dev_id = 21
reg_bits = 8

[ST7789.display]
data_bus = "display_bus"
display_width = 240
display_height = 320
backlight_pin = 1           # EXAMPLE_PIN_NUM_LCD_BL
# Reset pin is -1 per Arduino macro (not connected / software reset)
reset_pin = -1
backlight_on_state = "st7789.STATE_PWM"
color_space = "lv.COLOR_FORMAT.RGB565"
color_byte_order = "st7789.BYTE_ORDER_BGR"
rgb565_byte_swap = true

[display._ORIENTATION_TABLE]
# 0, 90, 180, 270 deg — adjust to match physical mounting
value = [0, 160, 192, 96]

[display.set_power]
params = [true]

[display.init]
params = []

# If using cst816s Python driver directly, enable its LVGL indev setup in code.
# Otherwise, replace this block with the matching driver section once confirmed.

[display.set_backlight]
params = [100]

[task_handler.TaskHandler]
params=[]